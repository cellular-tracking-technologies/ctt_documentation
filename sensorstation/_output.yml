bookdown::gitbook:
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">CTT SensorStation Guide</a></li>
      after: |
        <li><a href="https://celltracktech.com" target="blank">Cellular Tracking Technologies</a></li>
    download: null
    sharing:
      github: no
      facebook: no
      twitter: no
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
