# Update the LTS version number in flashingComputeModule.html to match the
# latest GitHub release of sensor-station-software.
#
# Triggers:
#   - Daily schedule (checks if version changed; commits only when it has)
#   - Manual (workflow_dispatch) for immediate update
#   - repository_dispatch from sensor-station-software (optional — requires a
#     PAT with repo scope stored as DOCS_DISPATCH_TOKEN in that repo)
name: update-flashing-guide

on:
  schedule:
    - cron: '30 6 * * *'       # daily at 06:30 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release version
        id: release
        run: |
          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/cellular-tracking-technologies/sensor-station-software/releases/latest)"
          VERSION="$(echo "$RELEASE_JSON" | jq -r .tag_name | sed 's/^v//')"
          URL="$(echo "$RELEASE_JSON" | jq -r .html_url)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Latest release: v$VERSION ($URL)"

      - name: Check if update needed
        id: check
        run: |
          if grep -qF "Version ${{ steps.release.outputs.version }})" flashingComputeModule.html 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HTML already shows version ${{ steps.release.outputs.version }} — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "HTML needs update to version ${{ steps.release.outputs.version }}."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.x'

      - name: Update version in Rmd and HTML
        if: steps.check.outputs.skip != 'true'
        shell: python
        run: |
          import re, pathlib

          version = "${{ steps.release.outputs.version }}"
          url = "${{ steps.release.outputs.url }}"

          for filename in ("flashingComputeModule.Rmd", "flashingComputeModule.html"):
              p = pathlib.Path(filename)
              if not p.exists():
                  print(f"WARN: {filename} not found, skipping")
                  continue
              text = p.read_text()

              # 1) Update "LTS Disk Image (Version X.Y.Z)" to the new version
              text = re.sub(
                  r'(LTS Disk Image \(Version )\d+\.\d+\.\d+(\))',
                  rf'\g<1>{version}\2',
                  text,
              )

              # 2) Update the release URL next to the LTS version
              text = re.sub(
                  r'https://github\.com/cellular-tracking-technologies/sensor-station-software/releases/tag/v[\d.]+',
                  url,
                  text,
              )

              # 3) Update "Replaced by `Version X.Y.Z`" for the deprecated 1.7.0 entry
              #    (the first occurrence that is followed by "linked above. This image")
              text = re.sub(
                  r'(Replaced by [`<>code]*Version [`<>code]*)\d+\.\d+\.\d+',
                  rf'\g<1>{version}',
                  text,
                  count=1,
              )

              p.write_text(text)
              print(f"Updated {filename} to version {version}")

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flashingComputeModule.Rmd flashingComputeModule.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update flashing guide to SensorStation v${{ steps.release.outputs.version }}"
            git push
          fi
